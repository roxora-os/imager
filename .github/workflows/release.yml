name: Release

# Packages for Windows (x64 and arm64), macOS (arm64 and x86_64) and Linux
# (AppImage, .deb and .rpm for x86_64 and arm64), attached to a GitHub
# release on a version tag. The layout follows gahingwoo/RKDevelopTool-GUI's release.yml:
# unsigned unless signing secrets exist, the scarce Intel macOS runner never
# blocks the release, and the notes come from CHANGELOG.md.
# Every push to main also builds everything and replaces the rolling "ci"
# release (a pre-release): the app's CI update tier.
on:
  push:
    tags: ["v[0-9]*"]
    branches: [main]
  workflow_dispatch:

# Two pushes to main in a row: the older build is not worth finishing.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

permissions:
  contents: write

jobs:
  wasm:
    uses: ./.github/workflows/wasm.yml

  version:
    name: Tag matches package.json
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      # The in-app update check compares the release tags with the app's
      # version, so they must agree, suffix included: package.json
      # 0.1.5-beta.1 goes with the tag v0.1.5-beta.1.
      - run: |
          v=$(node -p "require('./package.json').version")
          [ "$v" = "${GITHUB_REF_NAME#v}" ] || { echo "tag $GITHUB_REF_NAME does not match package.json $v"; exit 1; }

  linux:
    name: Linux ${{ matrix.arch }}
    needs: wasm
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-22.04, eb: x64, pkg_arch: amd64, nfpm_arch: x86_64, unpacked: linux-unpacked }
          - { arch: arm64, runner: ubuntu-22.04-arm, eb: arm64, pkg_arch: arm64, nfpm_arch: arm64, unpacked: linux-arm64-unpacked }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Writer (Node.js packed with pkg, as Etcher's etcher-util)
        run: npm run writer
      - uses: actions/download-artifact@v4
        with:
          name: rkdeveloptool-wasm
          path: vendor/rkdeveloptool-wasm
      - run: npm run build
        env:
          NODE_ENV: production
      - run: npm run icons
      # lzma-native 8.0.6 ships x86-64 files as its linux-arm64 prebuilds:
      # keep only this target's prebuilds and replace wrong-CPU ones by a
      # build from source.
      - name: Native addons for this CPU
        run: node scripts/native-for-target.mjs ${{ matrix.eb }}
      - name: Electron app and AppImage
        run: npx electron-builder --linux dir AppImage --${{ matrix.eb }} --publish never
      - name: Name the AppImage
        run: |
          V=$(node -p "require('./package.json').version")
          f=$(ls dist/*.AppImage)
          want="dist/roxora-imager-$V-linux-${{ matrix.arch }}.AppImage"
          [ "$f" = "$want" ] || mv "$f" "$want"
      - name: Install nfpm
        run: |
          curl -fsSL -o /tmp/nfpm.tar.gz \
            "https://github.com/goreleaser/nfpm/releases/download/v2.41.0/nfpm_2.41.0_Linux_${{ matrix.nfpm_arch }}.tar.gz"
          sudo tar -xzf /tmp/nfpm.tar.gz -C /usr/local/bin nfpm
      # The metainfo's release entry is the version being built and its date:
      # the tag's version and the tagged commit's date, or package.json's
      # version and the commit's date when run by hand.
      - name: Set the metainfo release entry
        run: |
          V=$(node -p "require('./package.json').version")
          case "$GITHUB_REF" in refs/tags/v*) V="${GITHUB_REF_NAME#v}" ;; esac
          node scripts/metainfo-release.mjs "$V" "$(git log -1 --format=%cs)"
      # A mirror that hangs fails the step in minutes, and is tried again,
      # instead of holding the job.
      - name: AppStream and desktop file tools
        timeout-minutes: 12
        run: |
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          for i in 1 2 3; do
            sudo apt-get $APT update -qq && sudo apt-get $APT install -y -qq appstream desktop-file-utils xvfb && exit 0
            echo "apt failed (try $i); again in 20 s"; sleep 20
          done
          exit 1
      - name: Check the AppStream metadata
        run: |
          appstreamcli validate --no-net packaging/io.github.roxora_os.imager.metainfo.xml
          desktop-file-validate packaging/io.github.roxora_os.imager.desktop
      - name: Package deb and rpm
        env:
          PKG_ARCH: ${{ matrix.pkg_arch }}
          APP_DIR: ./dist/${{ matrix.unpacked }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          export VERSION
          rm -rf dist/app && cp -a "$APP_DIR" dist/app
          nfpm package -f packaging/nfpm.yaml -p deb -t dist/
          nfpm package -f packaging/nfpm.yaml -p rpm -t dist/
          ls -l dist/
      - name: What the packages carry (icons, desktop entry, metainfo; no firmware blobs)
        run: |
          node scripts/check-package.mjs dist/app ${{ matrix.eb }}
          dpkg-deb -c dist/*.deb | grep -E 'share/(icons|applications|metainfo)/' | awk '{print $NF}'
          if dpkg-deb -c dist/*.deb | grep -iE 'spl_loader|usbplug|rkbin|usbboot'; then echo "FAIL: firmware blobs in the .deb"; exit 1; fi
          APPIMAGE_EXTRACT_AND_RUN=1 ./dist/*.AppImage --appimage-extract > /dev/null
          node scripts/check-package.mjs squashfs-root ${{ matrix.eb }}
          ls squashfs-root/*.desktop squashfs-root/usr/share/icons/hicolor/*/apps/ 2>/dev/null || true
          rm -rf squashfs-root
      - name: Decompress a .img.xz in the packaged app
        run: ELECTRON_RUN_AS_NODE=1 dist/app/roxora-imager scripts/check-decompress.cjs "$PWD/dist/app/resources/app.asar"
      # A healthy app keeps running until timeout kills it (124). Anything
      # else means it exited on its own and never opened its window.
      - name: Smoke-test the AppImage on this runner
        run: |
          set +e
          APPIMAGE_EXTRACT_AND_RUN=1 timeout 40 xvfb-run -a dist/*.AppImage > /tmp/appimage.log 2>&1
          rc=$?
          cat /tmp/appimage.log
          [ "$rc" = 124 ] || { echo "FAIL: AppImage exited with $rc"; exit 1; }
      - name: Smoke-test the .deb on this runner
        timeout-minutes: 15
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y ./dist/*.deb
          test -u /opt/roxora-imager/chrome-sandbox
          test -f /usr/lib/udev/rules.d/70-roxora-imager.rules
          for f in /usr/share/icons/hicolor/{16x16,24x24,32x32,48x48,64x64,128x128,256x256,512x512}/apps/io.github.roxora_os.imager.png \
                   /usr/share/icons/hicolor/scalable/apps/io.github.roxora_os.imager.svg \
                   /usr/share/icons/hicolor/symbolic/apps/io.github.roxora_os.imager-symbolic.svg; do
            test -f "$f" || { echo "FAIL: missing $f"; exit 1; }
          done
          desktop-file-validate /usr/share/applications/io.github.roxora_os.imager.desktop
          appstreamcli validate --no-net /usr/share/metainfo/io.github.roxora_os.imager.metainfo.xml
          set +e
          timeout 30 xvfb-run -a roxora-imager > /tmp/deb.log 2>&1
          rc=$?
          cat /tmp/deb.log
          [ "$rc" = 124 ] || { echo "FAIL: installed app exited with $rc"; exit 1; }
      - name: Smoke-test the AppImage on a bare system
        if: matrix.arch == 'x86_64'
        run: |
          docker run --rm -v "$PWD/dist:/dist:ro" debian:bookworm-slim bash -euo pipefail -c '
            APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
            apt-get $APT update -qq
            # Only what an Electron app may expect from the host.
            DEBIAN_FRONTEND=noninteractive apt-get $APT install -y -qq --no-install-recommends \
              xvfb xauth libgtk-3-0 libnss3 libasound2 libgbm1 libxss1 libxtst6 > /dev/null
            cp /dist/*.AppImage /tmp/app.AppImage
            chmod +x /tmp/app.AppImage
            set +e
            APPIMAGE_EXTRACT_AND_RUN=1 timeout 40 xvfb-run -a /tmp/app.AppImage --no-sandbox > /tmp/app.log 2>&1
            rc=$?
            set -e
            cat /tmp/app.log
            if grep -q "cannot open shared object file" /tmp/app.log; then echo "FAIL: missing library"; exit 1; fi
            [ "$rc" = 124 ] || { echo "FAIL: exited with $rc"; exit 1; }
            echo "OK: app stayed running"
          '
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm

  linux-arm64-noble:
    name: Linux arm64 AppImage on Ubuntu 24.04
    needs: linux
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-arm64
          path: dist
      - name: Decompress a .img.xz in the packaged app
        run: |
          chmod +x dist/*.AppImage
          (cd dist && ./*.AppImage --appimage-extract > /dev/null)
          ELECTRON_RUN_AS_NODE=1 dist/squashfs-root/roxora-imager scripts/check-decompress.cjs "$PWD/dist/squashfs-root/resources/app.asar"

  macos:
    name: macOS ${{ matrix.arch }}
    needs: wasm
    runs-on: ${{ matrix.runner }}
    # Intel runners are scarce and retire around August 2027; never let
    # that build block the release.
    continue-on-error: ${{ matrix.arch == 'x86_64' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: arm64, runner: macos-15, eb: arm64, out: mac-arm64 }
          - { arch: x86_64, runner: macos-15-intel, eb: x64, out: mac }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Raw disk helper (C, opens the disk through authopen)
        run: npm run writer
      - uses: actions/download-artifact@v4
        with:
          name: rkdeveloptool-wasm
          path: vendor/rkdeveloptool-wasm
      - run: npm run build
        env:
          NODE_ENV: production
      - run: npm run icons
      - run: brew install create-dmg
      - name: Native addons for this CPU
        run: node scripts/native-for-target.mjs ${{ matrix.eb }}
      - name: Electron app
        run: |
          npx electron-builder --mac dir --${{ matrix.eb }} --publish never
          app=$(ls -d dist/${{ matrix.out }}/*.app | head -1)
          [ "$app" = "dist/${{ matrix.out }}/Roxora Imager.app" ] || mv "$app" "dist/${{ matrix.out }}/Roxora Imager.app"
          ls "dist/${{ matrix.out }}/Roxora Imager.app/Contents/MacOS" "dist/${{ matrix.out }}/Roxora Imager.app/Contents/Resources"
      # Developer ID + hardened runtime when the signing secrets are set,
      # ad hoc otherwise.
      - name: Sign the app
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: bash packaging/macos-sign.sh app "dist/${{ matrix.out }}/Roxora Imager.app"
      - name: Confirm the architecture
        run: file "dist/${{ matrix.out }}/Roxora Imager.app/Contents/MacOS/"*
      - name: Icon and no firmware blobs in the app
        run: |
          node scripts/check-package.mjs "dist/${{ matrix.out }}/Roxora Imager.app/Contents/Resources" ${{ matrix.eb }}
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' "dist/${{ matrix.out }}/Roxora Imager.app/Contents/Info.plist"
          cmp build-res/icon.icns "dist/${{ matrix.out }}/Roxora Imager.app/Contents/Resources/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' "dist/${{ matrix.out }}/Roxora Imager.app/Contents/Info.plist")"
          echo "OK: the bundle's icon is the design .icns"

      - name: Create the DMG
        run: |
          V=$(node -p "require('./package.json').version")
          bash packaging/make-dmg.sh "dist/${{ matrix.out }}/Roxora Imager.app" "dist/roxora-imager-$V-macos-${{ matrix.arch }}.dmg"
      - name: Notarize the DMG
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: bash packaging/macos-sign.sh dmg dist/*.dmg
      - name: Smoke-test the app
        run: |
          set +e
          # macOS has no timeout(1); SIGALRM after 30 s gives 142.
          exe=$(ls "dist/${{ matrix.out }}/Roxora Imager.app/Contents/MacOS/"* | head -1)
          ELECTRON_ENABLE_LOGGING=1 perl -e 'alarm 30; exec @ARGV' "$exe" --enable-logging > /tmp/app.log 2>&1
          rc=$?
          cat /tmp/app.log
          [ "$rc" = 142 ] || { echo "FAIL: exited with $rc"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: dist/*.dmg
  windows:
    name: Windows ${{ matrix.arch }}
    needs: wasm
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, runner: windows-2022, unpacked: win-unpacked }
          # Windows on Arm, native: the writer and the native addons are
          # built for arm64 on an arm64 runner.
          - { arch: arm64, runner: windows-11-arm, unpacked: win-arm64-unpacked }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Dependencies
        if: matrix.arch == 'x64'
        run: npm ci
      # windows-11-arm has only Visual Studio 2026, which the node-gyp 10 that
      # npm and Electron bring does not know ("unknown version"); node-gyp
      # 13.1 does. So: install without scripts, then build every native addon
      # that has no win32-arm64 prebuild with it, natively on arm64, and run
      # the other install scripts that matter by hand.
      - name: Dependencies, native addons built for arm64 with node-gyp 13.1
        if: matrix.arch == 'arm64'
        run: |
          set -e
          npm ci --ignore-scripts
          npm install -g node-gyp@13.1.0
          GYP="$(npm root -g)/node-gyp/bin/node-gyp.js"
          node "$GYP" --version
          # lzma-native ships liblzma.dll for x64 and x86 only: an arm64 one from vcpkg.
          /c/vcpkg/vcpkg.exe install liblzma:arm64-windows
          ls /c/vcpkg/installed/arm64-windows/bin/
          node scripts/lzma-native-win-arm64.mjs "$(ls /c/vcpkg/installed/arm64-windows/bin/*lzma*.dll | head -1)"
          for d in drivelist mountutils lzma-native @ronomon/direct-io; do
            echo "::group::$d"
            (cd "node_modules/$d" && node "$GYP" rebuild --arch=arm64)
            echo "::endgroup::"
          done
          # electron-builder leaves lzma-native's build/ out of the package (its
          # prebuilds/ go in), so the arm64 build goes where node-gyp-build
          # looks first, with the liblzma.dll it links beside it.
          mkdir -p node_modules/lzma-native/prebuilds/win32-arm64
          cp node_modules/lzma-native/build/Release/lzma_native.node node_modules/lzma-native/prebuilds/win32-arm64/node.napi.node
          cp node_modules/lzma-native/deps/bin_arm64/liblzma.dll node_modules/lzma-native/prebuilds/win32-arm64/
          # Optional for etcher-sdk (USB boot of other boards): built if it can be.
          (cd node_modules/winusb-driver-generator && node "$GYP" rebuild --arch=arm64) || echo "winusb-driver-generator not built (optional)"
          node node_modules/esbuild/install.js
          if [ -f node_modules/@yao-pkg/pkg/node_modules/esbuild/install.js ]; then node node_modules/@yao-pkg/pkg/node_modules/esbuild/install.js; fi
          (cd node_modules/electron-winstaller && node ./script/select-7z-arch.js)
      - name: Writer (Node.js packed with pkg, as Etcher's etcher-util)
        run: npm run writer
      - uses: actions/download-artifact@v4
        with:
          name: rkdeveloptool-wasm
          path: vendor/rkdeveloptool-wasm
      - run: npm run build
        env:
          NODE_ENV: production
      - run: npm run icons
      - name: Native addons for windows-${{ matrix.arch }} only
        run: node scripts/native-for-target.mjs ${{ matrix.arch }}
      # Unsigned: SmartScreen will warn. See docs/install.md.
      - name: Installer and zip
        run: npx electron-builder --win nsis zip --${{ matrix.arch }} --publish never
      - name: Icon and no firmware blobs in the app
        run: node scripts/check-package.mjs dist/${{ matrix.unpacked }}
      - name: Every native binary in the package is for ${{ matrix.arch }}
        run: node scripts/check-native-arch.mjs dist/${{ matrix.unpacked }} ${{ matrix.arch }}
      - name: Name the zip
        run: |
          V=$(node -p "require('./package.json').version")
          mv dist/roxora-imager-$V-win-${{ matrix.arch }}.zip dist/roxora-imager-$V-windows-${{ matrix.arch }}.zip
          ls -l dist
      - name: Smoke-test the app
        run: |
          set +e
          timeout 30 "dist/${{ matrix.unpacked }}/roxora-imager.exe" > app.log 2>&1
          rc=$?
          cat app.log
          [ "$rc" = 124 ] || { echo "FAIL: exited with $rc"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: |
            dist/*-setup.exe
            dist/*-windows-${{ matrix.arch }}.zip

  release:
    name: Publish the release
    needs: [version, linux, linux-arm64-noble, macos, windows]
    if: startsWith(github.ref, 'refs/tags/') && !cancelled() && needs.version.result == 'success' && needs.linux.result == 'success' && needs.linux-arm64-noble.result == 'success' && needs.macos.result == 'success' && needs.windows.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # The notes are the tag's section of CHANGELOG.md; the script fails
      # when there is none, so a release never goes out with blank notes.
      - run: sh packaging/release-notes.sh "${GITHUB_REF_NAME#v}" > release-notes.md
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Checksums
        run: |
          mkdir out
          find artifacts -path artifacts/rkdeveloptool-wasm -prune -o -type f -exec cp {} out/ \;
          (cd out && sha256sum -- * > SHA256SUMS)
          cat out/SHA256SUMS
      # The tag decides: vX.Y.Z is a normal release, which the app and
      # install.sh offer to everyone; a tag with a suffix (vX.Y.Z-beta.N) is
      # a beta, published as a pre-release and offered only to those who
      # asked for betas.
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          body_path: release-notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}

  ci-release:
    name: Rolling "ci" release (untested build of main)
    needs: [linux, linux-arm64-noble, macos, windows]
    # Linux and Windows must have built; a macOS runner that never came (they
    # are scarce) leaves the macOS files out rather than the whole release.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !cancelled() && needs.linux.result == 'success' && needs.windows.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Files and checksums
        run: |
          mkdir out
          find artifacts -path artifacts/rkdeveloptool-wasm -prune -o -type f -exec cp {} out/ \;
          # Version-less copies of the DMGs: the roxora-imager@nightly cask's URL stays the same.
          for a in arm64 x86_64; do
            f=$(ls out/roxora-imager-*-macos-$a.dmg 2>/dev/null | head -1 || true)
            if [ -n "$f" ]; then cp "$f" "out/roxora-imager-macos-$a.dmg"; fi
          done
          (cd out && sha256sum -- * > SHA256SUMS)
          cat out/SHA256SUMS
      - name: Replace the ci release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=${GITHUB_SHA::7}
          date=$(date -u +%Y-%m-%d)
          printf '%s\n' "Built from ${GITHUB_SHA} on ${date} by the Release workflow on main." "" \
            "Untested: nothing here has been run on a board or a test machine. Every successful build of main replaces this release." > notes.md
          gh release delete ci --yes --cleanup-tag -R "$GITHUB_REPOSITORY" || true
          gh release create ci out/* -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "CI build ${sha} ${date}" --notes-file notes.md
