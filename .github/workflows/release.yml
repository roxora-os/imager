name: Release

# Packages for Windows (x64), macOS (arm64 and x86_64) and Linux (AppImage,
# .deb and .rpm for x86_64 and arm64), attached to a GitHub release on a
# version tag. The layout follows gahingwoo/RKDevelopTool-GUI's release.yml:
# unsigned unless signing secrets exist, the scarce Intel macOS runner never
# blocks the release, and the notes come from CHANGELOG.md.
on:
  push:
    tags: ["v[0-9]*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wasm:
    uses: ./.github/workflows/wasm.yml

  version:
    name: Tag matches package.json
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      # The in-app update check compares the release tags with the app's
      # version, so they must agree, suffix included: package.json
      # 0.1.5-beta.1 goes with the tag v0.1.5-beta.1.
      - run: |
          v=$(node -p "require('./package.json').version")
          [ "$v" = "${GITHUB_REF_NAME#v}" ] || { echo "tag $GITHUB_REF_NAME does not match package.json $v"; exit 1; }

  linux:
    name: Linux ${{ matrix.arch }}
    needs: wasm
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-22.04, eb: x64, pkg_arch: amd64, nfpm_arch: x86_64, unpacked: linux-unpacked }
          - { arch: arm64, runner: ubuntu-22.04-arm, eb: arm64, pkg_arch: arm64, nfpm_arch: arm64, unpacked: linux-arm64-unpacked }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Writer (Node.js packed with pkg, as Etcher's etcher-util)
        run: npm run writer
      - uses: actions/download-artifact@v4
        with:
          name: rkdeveloptool-wasm
          path: vendor/rkdeveloptool-wasm
      - run: npm run build
        env:
          NODE_ENV: production
      - run: npm run icons
      # lzma-native 8.0.6 ships x86-64 files as its linux-arm64 prebuilds:
      # keep only this target's prebuilds and replace wrong-CPU ones by a
      # build from source.
      - name: Native addons for this CPU
        run: node scripts/native-for-target.mjs ${{ matrix.eb }}
      - name: Electron app and AppImage
        run: npx electron-builder --linux dir AppImage --${{ matrix.eb }} --publish never
      - name: Name the AppImage
        run: |
          V=$(node -p "require('./package.json').version")
          f=$(ls dist/*.AppImage)
          want="dist/roxora-imager-$V-linux-${{ matrix.arch }}.AppImage"
          [ "$f" = "$want" ] || mv "$f" "$want"
      - name: Install nfpm
        run: |
          curl -fsSL -o /tmp/nfpm.tar.gz \
            "https://github.com/goreleaser/nfpm/releases/download/v2.41.0/nfpm_2.41.0_Linux_${{ matrix.nfpm_arch }}.tar.gz"
          sudo tar -xzf /tmp/nfpm.tar.gz -C /usr/local/bin nfpm
      # The metainfo's release entry is the version being built and its date:
      # the tag's version and the tagged commit's date, or package.json's
      # version and the commit's date when run by hand.
      - name: Set the metainfo release entry
        run: |
          V=$(node -p "require('./package.json').version")
          case "$GITHUB_REF" in refs/tags/v*) V="${GITHUB_REF_NAME#v}" ;; esac
          node scripts/metainfo-release.mjs "$V" "$(git log -1 --format=%cs)"
      - name: Check the AppStream metadata
        run: |
          sudo apt-get update
          sudo apt-get install -y appstream desktop-file-utils xvfb
          appstreamcli validate --no-net packaging/io.github.roxora_os.imager.metainfo.xml
          desktop-file-validate packaging/io.github.roxora_os.imager.desktop
      - name: Package deb and rpm
        env:
          PKG_ARCH: ${{ matrix.pkg_arch }}
          APP_DIR: ./dist/${{ matrix.unpacked }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          export VERSION
          rm -rf dist/app && cp -a "$APP_DIR" dist/app
          nfpm package -f packaging/nfpm.yaml -p deb -t dist/
          nfpm package -f packaging/nfpm.yaml -p rpm -t dist/
          ls -l dist/
      - name: What the packages carry (icons, desktop entry, metainfo; no firmware blobs)
        run: |
          node scripts/check-package.mjs dist/app ${{ matrix.eb }}
          dpkg-deb -c dist/*.deb | grep -E 'share/(icons|applications|metainfo)/' | awk '{print $NF}'
          if dpkg-deb -c dist/*.deb | grep -iE 'spl_loader|usbplug|rkbin|usbboot'; then echo "FAIL: firmware blobs in the .deb"; exit 1; fi
          APPIMAGE_EXTRACT_AND_RUN=1 ./dist/*.AppImage --appimage-extract > /dev/null
          node scripts/check-package.mjs squashfs-root ${{ matrix.eb }}
          ls squashfs-root/*.desktop squashfs-root/usr/share/icons/hicolor/*/apps/ 2>/dev/null || true
          rm -rf squashfs-root
      - name: Decompress a .img.xz in the packaged app
        run: ELECTRON_RUN_AS_NODE=1 dist/app/roxora-imager scripts/check-decompress.cjs "$PWD/dist/app/resources/app.asar"
      # A healthy app keeps running until timeout kills it (124). Anything
      # else means it exited on its own and never opened its window.
      - name: Smoke-test the AppImage on this runner
        run: |
          set +e
          APPIMAGE_EXTRACT_AND_RUN=1 timeout 40 xvfb-run -a dist/*.AppImage > /tmp/appimage.log 2>&1
          rc=$?
          cat /tmp/appimage.log
          [ "$rc" = 124 ] || { echo "FAIL: AppImage exited with $rc"; exit 1; }
      - name: Smoke-test the .deb on this runner
        run: |
          sudo apt-get install -y ./dist/*.deb
          test -u /opt/roxora-imager/chrome-sandbox
          test -f /usr/lib/udev/rules.d/70-roxora-imager.rules
          for f in /usr/share/icons/hicolor/{16x16,24x24,32x32,48x48,64x64,128x128,256x256,512x512}/apps/io.github.roxora_os.imager.png \
                   /usr/share/icons/hicolor/scalable/apps/io.github.roxora_os.imager.svg \
                   /usr/share/icons/hicolor/symbolic/apps/io.github.roxora_os.imager-symbolic.svg; do
            test -f "$f" || { echo "FAIL: missing $f"; exit 1; }
          done
          desktop-file-validate /usr/share/applications/io.github.roxora_os.imager.desktop
          appstreamcli validate --no-net /usr/share/metainfo/io.github.roxora_os.imager.metainfo.xml
          set +e
          timeout 30 xvfb-run -a roxora-imager > /tmp/deb.log 2>&1
          rc=$?
          cat /tmp/deb.log
          [ "$rc" = 124 ] || { echo "FAIL: installed app exited with $rc"; exit 1; }
      - name: Smoke-test the AppImage on a bare system
        if: matrix.arch == 'x86_64'
        run: |
          docker run --rm -v "$PWD/dist:/dist:ro" debian:bookworm-slim bash -euo pipefail -c '
            apt-get update -qq
            # Only what an Electron app may expect from the host.
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
              xvfb xauth libgtk-3-0 libnss3 libasound2 libgbm1 libxss1 libxtst6 > /dev/null
            cp /dist/*.AppImage /tmp/app.AppImage
            chmod +x /tmp/app.AppImage
            set +e
            APPIMAGE_EXTRACT_AND_RUN=1 timeout 40 xvfb-run -a /tmp/app.AppImage --no-sandbox > /tmp/app.log 2>&1
            rc=$?
            set -e
            cat /tmp/app.log
            if grep -q "cannot open shared object file" /tmp/app.log; then echo "FAIL: missing library"; exit 1; fi
            [ "$rc" = 124 ] || { echo "FAIL: exited with $rc"; exit 1; }
            echo "OK: app stayed running"
          '
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm

  linux-arm64-noble:
    name: Linux arm64 AppImage on Ubuntu 24.04
    needs: linux
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-arm64
          path: dist
      - name: Decompress a .img.xz in the packaged app
        run: |
          chmod +x dist/*.AppImage
          (cd dist && ./*.AppImage --appimage-extract > /dev/null)
          ELECTRON_RUN_AS_NODE=1 dist/squashfs-root/roxora-imager scripts/check-decompress.cjs "$PWD/dist/squashfs-root/resources/app.asar"

  macos:
    name: macOS ${{ matrix.arch }}
    needs: wasm
    runs-on: ${{ matrix.runner }}
    # Intel runners are scarce and retire around August 2027; never let
    # that build block the release.
    continue-on-error: ${{ matrix.arch == 'x86_64' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: arm64, runner: macos-15, eb: arm64, out: mac-arm64 }
          - { arch: x86_64, runner: macos-15-intel, eb: x64, out: mac }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Raw disk helper (C, opens the disk through authopen)
        run: npm run writer
      - uses: actions/download-artifact@v4
        with:
          name: rkdeveloptool-wasm
          path: vendor/rkdeveloptool-wasm
      - run: npm run build
        env:
          NODE_ENV: production
      - run: npm run icons
      - run: brew install create-dmg
      - name: Native addons for this CPU
        run: node scripts/native-for-target.mjs ${{ matrix.eb }}
      - name: Electron app
        run: |
          npx electron-builder --mac dir --${{ matrix.eb }} --publish never
          app=$(ls -d dist/${{ matrix.out }}/*.app | head -1)
          [ "$app" = "dist/${{ matrix.out }}/Roxora Imager.app" ] || mv "$app" "dist/${{ matrix.out }}/Roxora Imager.app"
          ls "dist/${{ matrix.out }}/Roxora Imager.app/Contents/MacOS" "dist/${{ matrix.out }}/Roxora Imager.app/Contents/Resources"
      # Developer ID + hardened runtime when the signing secrets are set,
      # ad hoc otherwise.
      - name: Sign the app
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: bash packaging/macos-sign.sh app "dist/${{ matrix.out }}/Roxora Imager.app"
      - name: Confirm the architecture
        run: file "dist/${{ matrix.out }}/Roxora Imager.app/Contents/MacOS/"*
      - name: Icon and no firmware blobs in the app
        run: |
          node scripts/check-package.mjs "dist/${{ matrix.out }}/Roxora Imager.app/Contents/Resources" ${{ matrix.eb }}
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' "dist/${{ matrix.out }}/Roxora Imager.app/Contents/Info.plist"
          cmp build-res/icon.icns "dist/${{ matrix.out }}/Roxora Imager.app/Contents/Resources/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' "dist/${{ matrix.out }}/Roxora Imager.app/Contents/Info.plist")"
          echo "OK: the bundle's icon is the design .icns"

      - name: Create the DMG
        run: |
          V=$(node -p "require('./package.json').version")
          bash packaging/make-dmg.sh "dist/${{ matrix.out }}/Roxora Imager.app" "dist/roxora-imager-$V-macos-${{ matrix.arch }}.dmg"
      - name: Notarize the DMG
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: bash packaging/macos-sign.sh dmg dist/*.dmg
      - name: Smoke-test the app
        run: |
          set +e
          # macOS has no timeout(1); SIGALRM after 30 s gives 142.
          exe=$(ls "dist/${{ matrix.out }}/Roxora Imager.app/Contents/MacOS/"* | head -1)
          ELECTRON_ENABLE_LOGGING=1 perl -e 'alarm 30; exec @ARGV' "$exe" --enable-logging > /tmp/app.log 2>&1
          rc=$?
          cat /tmp/app.log
          [ "$rc" = 142 ] || { echo "FAIL: exited with $rc"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: dist/*.dmg
  windows:
    name: Windows x64
    needs: wasm
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Writer (Node.js packed with pkg, as Etcher's etcher-util)
        run: npm run writer
      - uses: actions/download-artifact@v4
        with:
          name: rkdeveloptool-wasm
          path: vendor/rkdeveloptool-wasm
      - run: npm run build
        env:
          NODE_ENV: production
      - run: npm run icons
      # Unsigned: SmartScreen will warn. See docs/install.md.
      - name: Installer and zip
        run: npx electron-builder --win nsis zip --x64 --publish never
      - name: Icon and no firmware blobs in the app
        run: node scripts/check-package.mjs dist/win-unpacked
      - name: Name the zip
        run: |
          V=$(node -p "require('./package.json').version")
          mv dist/roxora-imager-$V-win-x64.zip dist/roxora-imager-$V-windows-x64.zip
          ls -l dist
      - name: Smoke-test the app
        run: |
          set +e
          timeout 30 "dist/win-unpacked/roxora-imager.exe" > app.log 2>&1
          rc=$?
          cat app.log
          [ "$rc" = 124 ] || { echo "FAIL: exited with $rc"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            dist/*-setup.exe
            dist/*-windows-x64.zip

  release:
    name: Publish the release
    needs: [version, linux, linux-arm64-noble, macos, windows]
    if: startsWith(github.ref, 'refs/tags/') && !cancelled() && needs.version.result == 'success' && needs.linux.result == 'success' && needs.linux-arm64-noble.result == 'success' && needs.macos.result == 'success' && needs.windows.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # The notes are the tag's section of CHANGELOG.md; the script fails
      # when there is none, so a release never goes out with blank notes.
      - run: sh packaging/release-notes.sh "${GITHUB_REF_NAME#v}" > release-notes.md
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Checksums
        run: |
          mkdir out
          find artifacts -path artifacts/rkdeveloptool-wasm -prune -o -type f -exec cp {} out/ \;
          (cd out && sha256sum -- * > SHA256SUMS)
          cat out/SHA256SUMS
      # The tag decides: vX.Y.Z is a normal release, which the app and
      # install.sh offer to everyone; a tag with a suffix (vX.Y.Z-beta.N) is
      # a beta, published as a pre-release and offered only to those who
      # asked for betas.
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          body_path: release-notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
