name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wasm:
    name: rkdeveloptool WASM
    uses: ./.github/workflows/wasm.yml

  test:
    name: Tests, Maskrom in Electron, screenshots
    needs: wasm
    runs-on: ubuntu-24.04
    # A test that never ends must not hold a runner for six hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: rkdeveloptool-wasm
          path: vendor/rkdeveloptool-wasm
      # fonts-noto-cjk: the runner has no Chinese font, so the zh-CN
      # screenshots would come out as boxes. A mirror that hangs fails the
      # step in minutes and is tried again; without the font the rest of the
      # job still runs.
      - name: A Chinese font
        timeout-minutes: 12
        continue-on-error: true
        run: |
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          for i in 1 2 3; do
            sudo apt-get $APT update -qq && sudo apt-get $APT install -y -qq fonts-noto-cjk && exit 0
            echo "apt failed (try $i); again in 20 s"; sleep 20
          done
          exit 1
      - name: Shell scripts
        run: shellcheck -S warning install.sh packaging/*.sh scripts/*.sh
      - run: npm run typecheck
      - name: Unit tests (catalog, targets, both languages, Maskrom through the WASM against a pretend board)
        run: npm test
      - name: Maskrom loader built from rkbin matches its pin
        run: node scripts/check-loader.mjs
      - name: Tests of the modules copied from edk2-webflash (xz, image source)
        run: node --test test/webflash/*.test.js
      - name: Web build
        run: node scripts/build-web.mjs
      - run: npm run build
      - name: Maskrom path inside Electron against a pretend board
        run: xvfb-run -a node scripts/electron-maskrom-e2e.mjs
      - name: Scrolling and text selection inside Electron at small window sizes
        run: xvfb-run -a node scripts/electron-scroll-e2e.mjs
      - name: Screenshots
        run: |
          xvfb-run -a node scripts/shots.mjs shots
          xvfb-run -a node scripts/web-shots.mjs shots/web
      # With the real releases from GitHub, for the README; a network
      # problem must not fail CI.
      - name: README screenshots
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: xvfb-run -a node scripts/readme-shots.mjs shots/readme
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots/

  sd-e2e-mac:
    name: SD write through authopen to a RAM disk on macOS
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Built as in release.yml, so this is the helper the DMG ships.
      - name: Raw disk helper (C, opens the disk through authopen)
        run: npm run writer
      - run: file build-res/writer/roxora-imager-rawdisk
      - run: command -v xz || brew install xz
      - name: Write, read back, refuse the system disk, cancel
        run: node test/e2e/sd-ramdisk-mac.mjs
      - name: In-app update, swap the app for the one in a DMG (real hdiutil, ditto, xattr)
        run: node test/e2e/update-dmg-mac.mjs
      # The casks of gahingwoo/homebrew-tap as scripts/bump-cask.mjs writes
      # them (made-up checksums for the tagged one), in a local tap, through
      # brew's own style check and an offline audit.
      - name: Homebrew casks pass brew style and audit
        run: |
          set -eux
          mkdir -p /tmp/casks
          node scripts/bump-cask.mjs ci /tmp/casks
          node --input-type=module -e "
            import { taggedCask } from './scripts/bump-cask.mjs';
            import { writeFileSync } from 'node:fs';
            const c = taggedCask('v0.2.0', { arm: 'a'.repeat(64), intel: 'b'.repeat(64) });
            writeFileSync('/tmp/casks/' + c.name + '.rb', c.text);"
          brew tap-new --no-git local/check
          mkdir -p "$(brew --repository local/check)/Casks"
          cp /tmp/casks/*.rb "$(brew --repository local/check)/Casks/"
          brew style local/check
          brew trust local/check || true
          for c in roxora-imager roxora-imager@nightly; do brew audit --cask --strict "local/check/$c"; done

  sd-e2e:
    name: SD write to a loop device
    needs: wasm
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Writer (Node.js packed with pkg, as Etcher's etcher-util)
        run: npm run writer
      - uses: actions/download-artifact@v4
        with:
          name: rkdeveloptool-wasm
          path: vendor/rkdeveloptool-wasm
      - run: npm run build
      - name: Write, read back, refuse the system disk
        run: node test/e2e/sd-loop.mjs
