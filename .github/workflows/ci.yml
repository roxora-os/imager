name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wasm:
    name: rkdeveloptool WASM
    uses: ./.github/workflows/wasm.yml

  test:
    name: Tests, Maskrom in Electron, screenshots
    needs: wasm
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: rkdeveloptool-wasm
          path: vendor/rkdeveloptool-wasm
      - name: Shell scripts
        run: shellcheck -S warning install.sh packaging/*.sh scripts/*.sh
      - run: npm run typecheck
      - name: Unit tests (catalog, targets, Maskrom through the WASM against a pretend board)
        run: npm test
      - name: Maskrom loader built from rkbin matches its pin
        run: node scripts/check-loader.mjs
      - name: Tests of the modules copied from edk2-webflash (xz, image source)
        run: node --test test/webflash/*.test.js
      - name: Web build
        run: node scripts/build-web.mjs
      - run: npm run build
      - name: Maskrom path inside Electron against a pretend board
        run: xvfb-run -a node scripts/electron-maskrom-e2e.mjs
      - name: Screenshots
        run: |
          xvfb-run -a node scripts/shots.mjs shots
          xvfb-run -a node scripts/web-shots.mjs shots/web
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots/

  sd-e2e-mac:
    name: SD write through authopen to a RAM disk on macOS
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Built as in release.yml, so this is the helper the DMG ships.
      - name: Raw disk helper (C, opens the disk through authopen)
        run: npm run writer
      - run: file build-res/writer/roxora-imager-rawdisk
      - run: command -v xz || brew install xz
      - name: Write, read back, refuse the system disk, cancel
        run: node test/e2e/sd-ramdisk-mac.mjs

  sd-e2e:
    name: SD write to a loop device
    needs: wasm
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Writer (Node.js packed with pkg, as Etcher's etcher-util)
        run: npm run writer
      - uses: actions/download-artifact@v4
        with:
          name: rkdeveloptool-wasm
          path: vendor/rkdeveloptool-wasm
      - run: npm run build
      - name: Write, read back, refuse the system disk
        run: node test/e2e/sd-loop.mjs
